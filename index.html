.h1t{font-size:1rem;letter-spacing:.08em;line-height:1.15;color:var(--accent);border-left:1px solid var(--line);padding-left:12px}
.asof{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.fresh{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.dot.old{background:var(--accent)}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
nav::-webkit-scrollbar{display:none}
nav button{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:7px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.seg-list{display:flex;flex-direction:column;gap:10px}
.seg-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.seg-card.total{border-color:var(--ink)}
.seg-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg-name{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.05rem}
.seg-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:1.35rem;font-weight:500}
.mid{font-size:1rem}
.pill{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-num);font-size:.8rem;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.up{background:var(--up-soft);color:var(--up)}
.pill.down{background:var(--down-soft);color:var(--down)}
.pill.flat{background:var(--flat-soft);color:var(--flat)}
.note{font-size:.78rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.goal{grid-column:1/-1}
.track{height:10px;background:var(--bar);border-radius:6px;overflow:hidden;position:relative}
.fill{height:100%;background:var(--accent);border-radius:6px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{display:flex;flex-direction:column;gap:2px}
.ideal-num{color:var(--muted)}
.track{overflow:visible}
.ideal-mark{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.ideal-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.ideal-line b{color:var(--ink);font-weight:500}
.loc-ideal{align-items:center;flex-wrap:wrap}
.presu-row{border-top:1px dashed var(--line);padding-top:8px}
.loc-ideal .pill{font-size:.72rem;padding:1px 6px}
.goal-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.1rem;margin:0}
.rank-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sort{display:flex;gap:4px}
.sort button{font:inherit;font-size:.75rem;border:1px solid var(--line);background:transparent;color:var(--muted);padding:4px 9px;border-radius:6px;cursor:pointer}
.sort button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
ol.rank{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
ol.rank li{display:grid;grid-template-columns:1.6rem 1fr auto;gap:4px 10px;padding:11px 12px;border-top:1px solid var(--line);align-items:center}
ol.rank li:first-child{border-top:0}
.pos{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.loc{font-weight:600;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.loc-bar{grid-column:2/4;height:4px;background:var(--flat-soft);border-radius:3px;overflow:hidden}
.loc-bar span{display:block;height:100%;background:var(--bar)}
.loc-nums{grid-column:2/4;display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.loc-nums b{color:var(--ink);font-weight:500}
li.zero{opacity:.55}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px}
.empty h2{font-size:1.05rem}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.lock input[type=password]{font:inherit;font-size:1rem;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.lock input[type=password]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.remember{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.lock button{font:inherit;font-weight:700;font-size:.95rem;padding:12px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
.lock button:disabled{opacity:.6;cursor:wait}
.err{color:var(--down);font-size:.85rem;min-height:1.2em;margin:0}
footer{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.vtabs{display:flex;gap:4px}
.vloc{display:block;font-weight:400;letter-spacing:.02em}
.vaxt{font-weight:600;font-size:1.05rem}
.pos.vtop{color:var(--accent);font-weight:600}
ol.rank li.few{opacity:.6}
.vn{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.vn span:nth-child(even){justify-self:end}
</style>

<script>
const TABS=[{id:'resumen',label:'Resumen'}];
let DATA=null, tab='resumen', sortBy='mtd';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const nf=(d)=>new Intl.NumberFormat('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
function money(v){
  if(v==null||isNaN(v))return '–';
  const a=Math.abs(v);
  if(a>=1e9) return '$ '+nf(2).format(v/1e9)+' mil M';
  if(a>=1e7) return '$ '+nf(1).format(v/1e6)+' M';
  if(a>=1e6) return '$ '+nf(2).format(v/1e6)+' M';
  if(a>=1e3) return '$ '+nf(0).format(v/1e3)+' k';
  return '$ '+nf(0).format(v);
}
const full=v=>v==null?'–':'$ '+nf(0).format(v);
const int=v=>v==null?'–':nf(0).format(v);
const pct=v=>v==null?'–':nf(1).format(v*100)+'%';
function pill(v){
  if(v==null||isNaN(v))return '<span class="pill flat">s/d</span>';
  const c=v>0.0005?'up':v<-0.0005?'down':'flat';
  const arrow=c==='up'?'▲':c==='down'?'▼':'■';
  return `<span class="pill ${c}">${arrow} ${(v>0?'+':'')+nf(1).format(v*100)}%</span>`;
}
function ago(iso){
  if(!iso)return '';
  const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(m<1)return 'recién';
  if(m<60)return `hace ${m} min`;
  const h=Math.round(m/60); if(h<48)return `hace ${h} h`;
  return `hace ${Math.round(h/24)} días`;
}
function fmtDateTime(iso){
  try{return new Date(iso).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return iso}
}
function fd(s){return s?s.slice(8,10)+'/'+s.slice(5,7):'día'}
function lastAll(){const ds=(DATA?.segments||[]).map(s=>s.lastDate).filter(Boolean).sort();return ds.length?ds[ds.length-1]:null}
const ax=v=>v==null?'–':nf(2).format(v);
function axtTile(a,dl){if(!a)return '';return `<div class="kpi goal"><div class="goal-row"><span class="label">Artículos por ticket (AXT)</span>${a.crec!=null?`<span class="sub">${pill(a.crec)} mes vs año ant.</span>`:''}</div><div class="cmp"><div><span class="label">${dl}</span><span class="num big">${ax(a.day)}</span></div><div><span class="label">Acum. mes</span><span class="num big">${ax(a.mtd)}</span></div></div></div>`}
function shortSeg(n){return n.replace('Argentina Propios','ARG Propios')}

function renderTabs(){
  const segs=(DATA?.segments||[]).map(s=>({id:slug(s.name),label:shortSeg(s.name)}));
  const all=[...TABS,...segs,...(DATA?.vendedoras?[{id:'vendedoras',label:'Vendedoras'}]:[])];
  if(!all.find(t=>t.id===tab))tab='resumen';
  $('#tabs').innerHTML=all.map(t=>`<button role="tab" id="tab-${t.id}" aria-selected="${t.id===tab}" data-tab="${t.id}">${esc(t.label)}</button>`).join('');
}
function go(id){tab=id;try{history.replaceState(null,'','#'+id)}catch(e){}render();window.scrollTo({top:0})}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)go(b.dataset.tab)});

function renderResumen(){
  const segMap=Object.fromEntries((DATA.segments||[]).map(s=>[slug(s.name),s]));
  const cards=(DATA.summary||[]).map(r=>{
    const key=slug(r.name.replace(/\s*\(.*\)/,''));
    const target=segMap[key]?key:'';
    const isTot=/^total/i.test(r.name);
    return `<button class="seg-card${isTot?' total':''}" ${target?`data-go="${target}"`:''} type="button">
      <div class="seg-head"><span class="seg-name">${esc(r.name)}</span>${pill(r.growth)}</div>
      <div class="seg-row">
        <div><div class="label">Acum. mes</div><div class="num big">${money(r.mtd)}</div></div>
        <div><div class="label">Venta ${fd(segMap[key]?.lastDate||lastAll())}</div><div class="num big">${money(r.day)}</div></div>
      </div>
      ${segMap[key]?.kpis?.ideal?.presu?`<div class="ideal-line"><span>Presupuesto <b class="num">${money(segMap[key].kpis.ideal.presu)}</b></span><span>Cumpl. <b class="num">${pct(segMap[key].kpis.ideal.presuCumpl)}</b></span></div>`:''}
      ${segMap[key]?.kpis?.axt?.mtd!=null?`<div class="ideal-line"><span>AXT mes <b class="num">${ax(segMap[key].kpis.axt.mtd)}</b></span>${segMap[key].kpis.axt.crec!=null?`<span>vs año ant.</span>${pill(segMap[key].kpis.axt.crec)}`:''}</div>`:''}
      ${segMap[key]?.kpis?.ideal?`<div class="ideal-line"><span>Cumpl. <b class="num">${pct(segMap[key].kpis.ideal.real)}</b></span><span>Ideal <b class="num">${pct(segMap[key].kpis.ideal.ideal)}</b></span>${gapPill(segMap[key].kpis.ideal.real,segMap[key].kpis.ideal.ideal)}</div>`:''}
    </button>`}).join('');
  return `<section class="seg-list">${cards}</section>
    <p class="note">${esc(DATA.currencyNote||'')} El % compara el acumulado del mes contra el año anterior.</p>`;
}

function gapPill(real,ideal){
  if(real==null||ideal==null)return '';
  const d=(real-ideal)*100, c=d>0.05?'up':d<-0.05?'down':'flat';
  return `<span class="pill ${c}">${d>0?'+':''}${nf(1).format(d)} pp vs ideal</span>`;
}
function goalIdeal(k,obj){
  const g=k.ideal, real=g.real??k.cumplimiento?.mtd, ideal=g.ideal;
  const w=v=>Math.max(0,Math.min(100,(v||0)*100));
  return `<div class="kpi goal">
    <div class="goal-row"><span class="label">Objetivo del mes</span><span class="num mid">${full(obj)}</span></div>
    <div class="cmp">
      <div><span class="label">Cumplimiento real</span><span class="num big">${pct(real)}</span></div>
      <div><span class="label">Ideal a la fecha</span><span class="num big ideal-num">${pct(ideal)}</span></div>
    </div>
    ${g.presu?`<div class="goal-row presu-row"><span class="label">Presupuesto</span><span class="num mid">${full(g.presu)}</span></div><div class="goal-row"><span class="sub">Cumplimiento vs presupuesto</span><span class="num mid"><b>${pct(g.presuCumpl)}</b></span></div>`:''}
    <div class="track" role="img" aria-label="Real ${pct(real)}, ideal ${pct(ideal)}"><div class="fill" style="width:${w(real)}%"></div><span class="ideal-mark" style="left:${w(ideal)}%"></span></div>
    <div class="goal-row">${gapPill(real,ideal)}<span class="note">Barra = real · línea = ideal · GAP mensual ${esc(g.mes||'')} ${esc(g.anio||'')}</span></div>
  </div>`;
}
function renderSeg(s){
  const k=s.kpis||{}, cur=s.currency, dl=fd(s.lastDate);
  const obj=k.objetivo?.mtd, cum=k.cumplimiento?.mtd;
  const ldate=s.lastDate?new Date(s.lastDate+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'}):'–';
  const locs=[...(s.locales||[])];
  locs.sort((a,b)=>sortBy==='growth'?((b.growth??-99)-(a.growth??-99)):sortBy==='day'?((b.day??0)-(a.day??0)):((b.mtd??0)-(a.mtd??0)));
  const max=Math.max(1,...locs.map(l=>l.mtd||0));
  return `
  <section class="kpis">
    <div class="kpi"><span class="label">Venta ${dl}</span><span class="num big">${money(k.venta?.day)}</span><span class="sub">${pill(k.crec?.day)} vs año ant.</span></div>
    <div class="kpi"><span class="label">Acum. mes</span><span class="num big">${money(k.venta?.mtd)}</span><span class="sub">${pill(k.crec?.mtd)} vs año ant.</span></div>
    <div class="kpi"><span class="label">Tickets</span><span class="num mid">${int(k.tickets?.day)} <small class="note">${dl}</small></span><span class="num mid">${int(k.tickets?.mtd)} <small class="note">mes</small></span></div>
    <div class="kpi"><span class="label">Ticket promedio</span><span class="num mid">${money(k.ticketProm?.day)} <small class="note">${dl}</small></span><span class="num mid">${money(k.ticketProm?.mtd)} <small class="note">mes</small></span></div>
    ${axtTile(k.axt,dl)}
    ${k.ideal?goalIdeal(k,obj):`<div class="kpi goal">
      <div class="goal-row"><span class="label">Objetivo del mes</span><span class="num mid">${full(obj)}</span></div>
      <div class="track" role="img" aria-label="Cumplimiento ${pct(cum)}"><div class="fill" style="width:${Math.max(0,Math.min(100,(cum||0)*100))}%"></div></div>
      <div class="goal-row"><span class="sub">${esc(k.cumplimiento?.label||'Cumplimiento')}</span><span class="num mid"><b>${pct(cum)}</b></span></div>
    </div>`}
  </section>
  <p class="note">Último día con datos: <span class="num">${esc(ldate)}</span> · Moneda: ${esc(cur)}</p>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="rank-head"><h2>Locales (${locs.length})</h2>
      <div class="sort" role="group" aria-label="Ordenar">
        <button type="button" data-sort="mtd" aria-pressed="${sortBy==='mtd'}">Acum. mes</button>
        <button type="button" data-sort="day" aria-pressed="${sortBy==='day'}">${dl}</button>
        <button type="button" data-sort="growth" aria-pressed="${sortBy==='growth'}">Crec. %</button>
      </div></div>
    <ol class="rank">${locs.map((l,i)=>`
      <li class="${!l.mtd?'zero':''}">
        <span class="pos">${i+1}</span><span class="loc">${esc(l.name)}</span>${pill(l.growth)}
        <div class="loc-bar"><span style="width:${((l.mtd||0)/max*100).toFixed(1)}%"></span></div>
        <div class="loc-nums"><span>Mes <b class="num">${money(l.mtd)}</b></span><span>${dl} <b class="num">${money(l.day)}</b></span></div>
        ${l.obj?`<div class="loc-nums"><span>Objetivo <b class="num">${money(l.obj)}</b></span></div>`:''}
        ${l.axt&&l.axt.mtd!=null?`<div class="loc-nums loc-ideal"><span>AXT mes <b class="num">${ax(l.axt.mtd)}</b> · ${dl} <b class="num">${ax(l.axt.day)}</b></span>${l.axt.crec!=null?pill(l.axt.crec):''}</div>`:''}
        ${l.ideal!=null?`<div class="loc-nums loc-ideal"><span>Cumpl. <b class="num">${pct(l.cumpl)}</b> · Ideal <b class="num">${pct(l.ideal)}</b></span>${gapPill(l.cumpl,l.ideal)}</div>`:''}
      </li>`).join('')}</ol>
  </section>`;
}

let vendSeg='LOCAL';
const fmtFull=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
function renderVend(v){
  const list=v[vendSeg]||[];
  const all=[...(v.LOCAL||[]),...(v.GONDOLA||[])];
  const nT=all.reduce((s,a)=>s+a.tickets,0), nA=all.reduce((s,a)=>s+a.articulos,0);
  const maxA=Math.max(1,...list.map(a=>a.axt||0));
  const lbl={LOCAL:'Locales',GONDOLA:'Góndolas'};
  return `
  <section class="kpis">
    <div class="kpi"><span class="label">Tickets del mes</span><span class="num big">${int(nT)}</span><span class="sub">${esc(v.mesLabel||'')} · al ${esc(fmtFull(v.asOf))}</span></div>
    <div class="kpi"><span class="label">Artículos x ticket</span><span class="num big">${nT?ax(nA/nT):'–'}</span><span class="sub">Promedio de todas</span></div>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="rank-head"><h2>Vendedoras · ${lbl[vendSeg]} (${list.length})</h2>
      <div class="sort vtabs" role="group" aria-label="Tipo de punto de venta">
        <button type="button" data-vend="LOCAL" aria-pressed="${vendSeg==='LOCAL'}">Locales</button>
        <button type="button" data-vend="GONDOLA" aria-pressed="${vendSeg==='GONDOLA'}">Góndolas</button>
      </div></div>
    <ol class="rank">${list.map(a=>`
      <li class="${a.tickets<10?'few':''}">
        <span class="pos${a.puesto<=3?' vtop':''}">${a.puesto}</span><span class="loc">${esc(a.nombre)}<small class="note vloc">${esc(a.local)}</small></span><span class="num vaxt">${ax(a.axt)}</span>
        <div class="loc-bar"><span style="width:${((a.axt||0)/maxA*100).toFixed(1)}%"></span></div>
        <div class="loc-nums vn"><span>Tickets <b class="num">${int(a.tickets)}</b></span><span>T. prom. <b class="num">${full(a.ticketProm)}</b></span><span>Fact. <b class="num">${money(a.venta)}</b></span><span>Art. <b class="num">${int(a.articulos)}</b></span></div>
      </li>`).join('')}</ol>
    <p class="note">Ordenado por artículos por ticket (la cifra de la derecha); empate por ticket promedio. Facturación sin IVA. En gris: menos de 10 tickets, el promedio no es representativo.</p>
  </section>`;
}
function footVend(v){return `<span>Fuente: exportación de tickets por vendedora · mes en curso (${esc(v.mesLabel||'')})</span><span>Ticket válido: cantidad &gt; 0 e importe sin IVA ≥ 0. Mismo criterio que Performance_Vendedores.xlsx.</span>`}
function render(){
  renderTabs();
  if(!DATA){return}
  $('#asof').textContent=DATA.asOf||'';
  const fresh=$('#fresh');
  const hrs=(Date.now()-new Date(DATA.extractedAt).getTime())/36e5;
  fresh.innerHTML=`<span class="dot${hrs>12?' old':''}"></span><span>Sincronizado ${esc(ago(DATA.extractedAt))} · Excel guardado ${esc(fmtDateTime(DATA.fileModified))}</span>`;
  const seg=(DATA.segments||[]).find(s=>slug(s.name)===tab);
  $('#view').innerHTML=seg?renderSeg(seg):(tab==='vendedoras'&&DATA.vendedoras)?renderVend(DATA.vendedoras):renderResumen();
  $('#foot').innerHTML=(tab==='vendedoras'&&DATA.vendedoras)?footVend(DATA.vendedoras):`<span>${esc(DATA.note||'')}</span><span>Fuente: ${esc(DATA.sourceFile||'')} · solapa Resumen Móvil</span>`;
}
$('#view').addEventListener('click',e=>{
  const s=e.target.closest('[data-sort]'); if(s){sortBy=s.dataset.sort;render();return}
  const vb=e.target.closest('[data-vend]'); if(vb){vendSeg=vb.dataset.vend;render();return}
  const g=e.target.closest('[data-go]'); if(g)go(g.dataset.go);
});

function showEmpty(title,msg){
  $('#view').innerHTML=`<div class="empty"><h2>${esc(title)}</h2><p class="note">${esc(msg)}</p></div>`;
  $('#fresh').innerHTML='<span class="dot old"></span><span>Sin datos</span>';
  $('#asof').textContent='';
}

const KEY_STORE='tcs-movil-key';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const toB64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
let ENV=null;
async function deriveRaw(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(ENV.salt),iterations:ENV.iter},base,256);
}
async function openWith(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENV.iv)},key,b64(ENV.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function start(d){DATA=d;render();setInterval(()=>{if(DATA)render()},60000)}
function lock(msg){
  $('#tabs').innerHTML='';
  $('#asof').textContent='';
  $('#fresh').innerHTML='<span class="dot old"></span><span>Contenido protegido</span>';
  $('#view').innerHTML=`<form class="lock" id="lock-form" autocomplete="off">
    <h2>Ingresá la contraseña</h2>
    <p class="note">Los datos de venta están encriptados. Pedile la contraseña a Tamara.</p>
    <label class="label" for="pw">Contraseña</label>
    <input id="pw" type="password" inputmode="text" autocomplete="current-password" required>
    <label class="remember"><input id="remember" type="checkbox" checked> Recordar en este dispositivo</label>
    <button type="submit" id="unlock">Ver ventas</button>
    <p class="err" id="err" role="alert">${esc(msg||'')}</p>
  </form>`;
  $('#lock-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=$('#unlock'); btn.disabled=true; btn.textContent='Abriendo…'; $('#err').textContent='';
    try{
      const raw=await deriveRaw($('#pw').value);
      const d=await openWith(raw);
      store(KEY_STORE,$('#remember').checked?toB64(raw)+'|'+ENV.salt:null);
      start(d);
    }catch(err){btn.disabled=false;btn.textContent='Ver ventas';$('#err').textContent='Contraseña incorrecta. Probá de nuevo.';$('#pw').select()}
  });
  setTimeout(()=>{try{$('#pw').focus()}catch(e){}},50);
}
(async()=>{
  const h=(location.hash||'').slice(1); if(h)tab=h;
  try{ENV=JSON.parse(document.getElementById('snap').textContent)}catch(e){ENV=null}
  if(!ENV||!ENV.ct){showEmpty('Todavía no hay datos','La primera carga desde el Excel aparece acá apenas corra la actualización.');return}
  if(!window.crypto?.subtle){showEmpty('Navegador no compatible','Abrí el link en Chrome, Safari o Edge actualizados.');return}
  const saved=load(KEY_STORE);
  if(saved){
    const [k,salt]=saved.split('|');
    if(salt===ENV.salt){try{start(await openWith(b64(k)));return}catch(e){}}
    store(KEY_STORE,null);
  }
  lock();
})();
</script>
